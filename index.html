<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farm Frites TMS" />
    <meta name="description" content="Farm Frites KSA — Transportation Management System" />
    <title>Farm Frites — Transportation Management System</title>
    <script>
      // Blocking, runs before first paint -- applies a saved dark-mode choice to <html> before
      // React ever mounts, so there is no flash of light-mode styling on load/refresh (see
      // ThemeContext.jsx, which owns this same localStorage key at runtime). Defaults to light
      // (no attribute) when nothing is stored or storage is unavailable (e.g. private browsing).
      ;(function () {
        try {
          if (localStorage.getItem('ff-tms-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
